<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TUC Next</title>
  <link id="system-colors" rel="stylesheet" href="/internal/colors.css">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <p id="message" class="error-card" role="alert"></p>
    <div id="operation" class="operation" role="status" aria-live="polite" hidden><span class="spinner" aria-hidden="true"></span><span id="operation-text"></span></div>
    <div id="panel-status" class="tab-panel" role="tabpanel" aria-labelledby="tab-status" tabindex="0">
      <section class="card" aria-label="Module overview">
        <p id="status" class="overview-status" role="status">Connecting…</p>
        <div class="overview-stats"><div><strong id="overview-apps">0</strong><span>Apps</span></div><div><strong id="overview-certs">0</strong><span>Certificates</span></div><div><strong id="overview-global">0</strong><span>Global CAs</span></div></div>
        <div class="actions"><button id="refresh" class="secondary" type="button" disabled>Refresh</button><button id="apply" class="secondary" type="button" aria-label="Reapply saved policy and stop configured apps" disabled>Reapply</button></div>
      </section>
      <details id="diagnostics" class="card"><summary>Diagnostics</summary><p id="status-reason" class="hint"></p><pre id="log">No data.</pre></details>
    </div>
    <div id="panel-certificates" class="tab-panel" role="tabpanel" aria-labelledby="tab-certificates" tabindex="0" hidden>
      <section class="card" aria-labelledby="certs-title">
        <div class="section-title"><h2 id="certs-title">Certificates</h2><span id="cert-count" class="count">0</span></div>
        <ul id="certificates" class="certificates"></ul>
        <button id="add-certificate" class="secondary" type="button" aria-label="Import a PEM or DER CA certificate, up to 64 KiB" disabled>Add certificate</button><input id="certificate" type="file" accept=".pem,.crt,.cer,.der" aria-label="Certificate file" hidden disabled>
      </section>
      <section class="card" aria-labelledby="global-title">
        <div class="section-title"><h2 id="global-title">Global trust</h2><span id="global-count" class="count">0</span></div>
        <p id="global-note" class="hint">All apps. Restart running apps after changes.</p>
        <div id="global-certificates"></div>
        <p id="global-mode-note" class="hint" hidden>User trust requires app support.</p>
      </section>
    </div>
    <div id="panel-apps" class="tab-panel" role="tabpanel" aria-labelledby="tab-apps" tabindex="0" hidden>
      <section class="card" aria-labelledby="apps-title">
        <div class="section-title"><h2 id="apps-title">Apps</h2><span id="selected-count" class="count">0</span></div>
        <label for="search" class="search-label">Search</label><input id="search" type="search" placeholder="App or package" autocomplete="off" disabled>
        <div id="profile-filter-wrap" hidden><label for="profile-filter" class="search-label">Profile</label><button id="profile-filter" class="profile-filter" type="button" aria-label="Profile" disabled>All profiles</button></div>
        <p id="selection-note" class="hint">Saving stops configured apps.</p>
      </section>
      <section class="card app-list-card" aria-label="App list"><div id="apps" class="apps"></div></section>
    </div>
  </main>
  <button id="save" class="save-fab" type="button" aria-label="Save policy and stop configured apps" hidden disabled>Save</button>
  <nav class="bottom-nav" role="tablist" aria-label="Sections" aria-orientation="horizontal">
    <button id="tab-status" class="nav-item" type="button" role="tab" aria-controls="panel-status" aria-selected="true" tabindex="0"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v1"/></svg></span><span>Overview</span></button>
    <button id="tab-certificates" class="nav-item" type="button" role="tab" aria-controls="panel-certificates" aria-selected="false" tabindex="-1"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6z"/><path d="m8.5 11.5 2.5 2.5 4.5-5"/></svg></span><span>Certificates</span></button>
    <button id="tab-apps" class="nav-item" type="button" role="tab" aria-controls="panel-apps" aria-selected="false" tabindex="-1"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></span><span>Apps</span></button>
  </nav>
  <div id="choice-menu" class="choice-menu" role="listbox" tabindex="-1" hidden></div>
</body>
</html>
