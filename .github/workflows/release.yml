---
# Github action that runs on module release to create files like
# Update JSON, CHANGELOG, ...

name: Generate update JSON and release module

permissions:
  contents: write

on:
  push:
    tags:
      - '*'
  
jobs:
  get_vars:
    name: Get module variables from module.prop
    runs-on: ubuntu-latest
    outputs:
      # Module.prop variables
      id: ${{ steps.vars.outputs.id }}
      name: ${{ steps.vars.outputs.name }}
      version: ${{ steps.vars.outputs.version }}
      versionCode: ${{ steps.vars.outputs.versionCode }}
      author: ${{ steps.vars.outputs.author }}
      description: ${{ steps.vars.outputs.description }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Get variables
        id: vars
        run: bash .github/bin/variables.sh

  create_release:
    name: Create release
    needs:
      - get_vars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        name: Checkout
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android build tools
        run: |
          sdkmanager 'ndk;29.0.13113456' 'build-tools;35.0.0' 'platforms;android-35' 'cmake;3.31.0'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.13113456" >> "$GITHUB_ENV"
      - name: Check certificate handling, WebUI and backend
        run: |
          bash .github/tests/test-certificates.sh
          bash .github/tests/test-hooks.sh
          node tests/webui.test.js
          python3 .github/tests/test-manage.py
          c++ -std=c++17 -Wall -Wextra -Werror native/protocol_test.cpp -o /tmp/tuc-protocol-test
          /tmp/tuc-protocol-test
          bash -c 'exec -a zygote64 /tmp/tuc-protocol-test --zygote-name-check'
      - name: Create module ZIP
        id: zip
        run: |
          ZIPNAME=tuc-next-${{ needs.get_vars.outputs.version }}.zip
          SOURCE_ZIPNAME=tuc-next-${{ needs.get_vars.outputs.version }}-source.zip
          echo zipname=$ZIPNAME >> $GITHUB_OUTPUT
          echo sourcezipname=$SOURCE_ZIPNAME >> $GITHUB_OUTPUT
          bash tools/build.sh
          cp ".artifacts/$ZIPNAME" "$ZIPNAME"
          cp ".artifacts/$SOURCE_ZIPNAME" "$SOURCE_ZIPNAME"
      
      - name: Generate update JSON
        run: bash .github/bin/updateJson.sh ${{ needs.get_vars.outputs.version }} ${{ needs.get_vars.outputs.versionCode }} changelog.md ${{ steps.zip.outputs.zipname }}
      
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          body: |
            TUC Next is distributed under GNU AGPLv3. The matching source code and build scripts are available in the attached ${{ steps.zip.outputs.sourcezipname }} archive at no additional charge. See LICENSE and NOTICE inside the archives.
          files: |
            changelog.md
            ${{ steps.zip.outputs.zipname }}
            ${{ steps.zip.outputs.sourcezipname }}
            update.json
